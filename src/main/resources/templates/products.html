<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Products - TechStock Control</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            TechStock Control
        </a>

        <a class="btn btn-outline-light" href="/add-product">
            Add Product
        </a>

    </div>

</nav>


<div class="container mt-5">


    <h1>Electronics Inventory</h1>

    <form method="get" action="/products" class="row mb-4">


<div class="col-md-4">

<input type="text"
       class="form-control"
       name="keyword"
       placeholder="Search product name"
       th:value="${keyword}">

</div>


<div class="col-md-3">

<select class="form-select" name="brand">

<option value="">
All Brands
</option>

<option value="Apple">
Apple
</option>

<option value="Samsung">
Samsung
</option>

<option value="Dell">
Dell
</option>

<option value="HP">
HP
</option>

</select>

</div>


<div class="col-md-3">

<select class="form-select" name="sortBy">

<option value="productName">
Sort by Name
</option>

<option value="price">
Sort by Price
</option>

</select>

</div>


<div class="col-md-2">

<button class="btn btn-primary">
Search
</button>

</div>


</form>


    <table class="table table-striped table-bordered mt-4">

        <thead class="table-dark">

        <tr>

            <th>ID</th>

            <th>Product Name</th>

            <th>Description</th>

            <th>Price</th>

            <th>Model Number</th>

            <th>Warranty Date</th>

            <th>Brand</th>

            <th>Type</th>

        </tr>

        </thead>


        <tbody>


        <tr th:each="product : ${products.content}">


            <td th:text="${product.productId}">
            </td>


            <td th:text="${product.productName}">
            </td>


            <td th:text="${product.description}">
            </td>


            <td th:text="${'$' + product.price}">
            </td>


            <td th:text="${product.modelNumber}">
            </td>


            <td th:text="${product.warrantyDate}">
            </td>


            <td th:text="${product.brand}">
            </td>


            <td th:text="${product.productType}">
            </td>


        </tr>


        </tbody>


    </table>

    <div class="mt-4">

<a class="btn btn-secondary"
   th:if="${products.hasPrevious()}"
   th:href="@{/products(page=${products.number-1}, keyword=${keyword}, brand=${brand})}">
Previous
</a>


<a class="btn btn-secondary"
   th:if="${products.hasNext()}"
   th:href="@{/products(page=${products.number+1}, keyword=${keyword}, brand=${brand})}">
Next
</a>

</div>

</div>


</body>

</html>
